<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Meditation Timer · 禅修计时器</title>
    <style>
        :root {
            --bg-deep: #080c13;
            --bg-surface: #121926;
            --bg-card: #182232;
            --border-subtle: rgba(212, 175, 55, 0.18);
            --border-highlight: #d4af37;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-glow: rgba(212, 175, 55, 0.28);
            --coral-accent: #e07a5f;
            --text-main: #f3f6fa;
            --text-muted: #8c9cb0;
            --text-gold: #e6c875;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 60px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 15%, rgba(212, 175, 55, 0.06) 0%, transparent 65%);
        }

        
        /* LANGUAGE SWITCHER */
        .lang-switch-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            max-width: 680px;
            margin-bottom: 12px;
        }
        .lang-switch-btn {
            background: rgba(24, 34, 50, 0.85);
            border: 1px solid var(--border-subtle);
            color: var(--text-gold);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(8px);
        }
        .lang-switch-btn:hover {
            border-color: var(--gold-primary);
            color: var(--gold-light);
            background: #1e293b;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 2.1rem;
            font-weight: 300;
            letter-spacing: 6px;
            color: var(--gold-primary);
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.35);
            margin-bottom: 6px;
        }
        p.sub-title {
            color: var(--text-muted);
            font-size: 0.92rem;
            letter-spacing: 2px;
            font-weight: 300;
        }

        /* MAIN CONTAINER */
        .app-container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* TIMER DIAL SECTION */
        .timer-display-card {
            background: radial-gradient(circle at center, #172233 0%, var(--bg-surface) 100%);
            border: 1px solid var(--border-subtle);
            border-radius: 28px;
            padding: 32px 16px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            position: relative;
            transition: border-color 0.3s ease;
        }
        @media (min-width: 480px) {
            .timer-display-card {
                padding: 36px 24px;
            }
        }
        .timer-display-card.running {
            border-color: rgba(212, 175, 55, 0.45);
        }

        /* CIRCULAR SVG PROGRESS */
        .dial-wrapper {
            position: relative;
            width: 290px;
            height: 290px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dial-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .dial-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 6;
        }
        .dial-progress {
            fill: none;
            stroke: url(#goldGradient);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 848; /* 2 * pi * 135 */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.85s linear;
        }
        .breathing-halo {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .running .breathing-halo {
            opacity: 1;
            animation: breathe 8s infinite ease-in-out;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(0.92); opacity: 0.15; }
            50% { transform: scale(1.12); opacity: 0.45; }
        }

        .dial-center-content {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .time-text {
            font-size: 3.8rem;
            font-weight: 200;
            letter-spacing: 3px;
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
            text-shadow: 0 4px 18px rgba(0,0,0,0.6);
        }
        .status-badge {
            font-size: 0.86rem;
            letter-spacing: 1.5px;
            color: var(--gold-light);
            margin-top: 6px;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold-primary);
            box-shadow: 0 0 8px var(--gold-primary);
        }
        .paused .status-dot {
            background: var(--coral-accent);
            box-shadow: 0 0 8px var(--coral-accent);
        }

        /* PRESET BUTTONS GRID */
        .preset-section {
            width: 100%;
        }
        .section-label {
            font-size: 0.82rem;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
        }
        @media (min-width: 540px) {
            .preset-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }
        .preset-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 13px 6px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .preset-btn span.unit {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 400;
        }
        .preset-btn:hover {
            background: #202c3e;
            border-color: var(--gold-primary);
            transform: translateY(-2px);
        }
        .preset-btn.active {
            background: linear-gradient(145deg, #2a384d, #1c2635);
            border-color: var(--gold-primary);
            color: var(--gold-light);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }
        .preset-btn.active span.unit {
            color: var(--gold-primary);
        }

        /* CUSTOM DURATION BAR */
        .custom-time-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 14px;
            width: 100%;
            flex-wrap: wrap;
        }
        .custom-time-btn {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .custom-time-btn:hover {
            color: var(--text-main);
            border-color: rgba(255,255,255,0.2);
        }
        .quick-test-badge {
            background: rgba(224, 122, 95, 0.15);
            border: 1px solid rgba(224, 122, 95, 0.35);
            color: var(--coral-accent);
        }
        .quick-test-badge:hover {
            border-color: var(--coral-accent);
            color: #ff9e80;
        }

        /* CONTROLS (START / PAUSE / RESET) */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 460px;
            margin-top: 6px;
        }
        @media (min-width: 480px) {
            .controls-row {
                gap: 16px;
            }
        }
        .btn-primary {
            background: linear-gradient(135deg, #e3be47 0%, #aa8214 100%);
            color: #0a0e16;
            border: none;
            padding: 14px 20px;
            border-radius: 40px;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.3);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1 1 auto;
            min-width: 110px;
            white-space: nowrap;
        }
        @media (min-width: 480px) {
            .btn-primary {
                padding: 16px 36px;
                font-size: 1.15rem;
                letter-spacing: 2px;
            }
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.45);
        }
        .btn-primary:active {
            transform: translateY(1px);
        }
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 12px;
            border-radius: 40px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 0 1 auto;
            min-width: 76px;
            text-align: center;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        @media (min-width: 480px) {
            .btn-secondary {
                padding: 16px 24px;
                font-size: 1rem;
                min-width: 96px;
            }
        }
        .btn-secondary:hover {
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.25);
            background: #1f2b3c;
        }

        /* SETTINGS CARD (SOUND SELECTION & VOLUME) */
        .settings-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 20px 24px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .setting-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        @media (min-width: 540px) {
            .setting-row {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }
        .setting-label {
            font-size: 0.9rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .setting-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        select.sound-select {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            max-width: 270px;
            transition: border-color 0.2s;
        }
        select.sound-select:focus {
            border-color: var(--gold-primary);
        }
        select.sound-select optgroup {
            background: #101622;
            color: var(--gold-primary);
            font-weight: 600;
        }
        select.sound-select option {
            background: var(--bg-card);
            color: var(--text-main);
            font-weight: normal;
        }

        .icon-btn {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--gold-primary);
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .icon-btn:hover {
            border-color: var(--gold-primary);
            background: #212c3e;
        }

        /* TOGGLES ROW */
        .toggles-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .toggle-item {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }
        .toggle-item input[type="checkbox"] {
            accent-color: var(--gold-primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* SOUND VAULT COLLAPSIBLE DRAWER */
        .sound-vault-toggle {
            background: transparent;
            border: 1px dashed rgba(212, 175, 55, 0.3);
            color: var(--text-gold);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sound-vault-toggle:hover {
            border-color: var(--gold-primary);
            background: rgba(212, 175, 55, 0.08);
        }
        .vault-container {
            width: 100%;
            max-width: 900px;
            display: none;
            flex-direction: column;
            gap: 20px;
            margin-top: 24px;
            animation: fadeIn 0.3s ease;
        }
        .vault-container.show {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .vault-category-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: #fff;
            border-left: 3px solid var(--gold-primary);
            padding-left: 10px;
            margin-bottom: 12px;
        }
        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 14px;
        }
        .vault-card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            transition: border-color 0.2s;
        }
        .vault-card:hover {
            border-color: rgba(212, 175, 55, 0.3);
        }
        .vault-name {
            font-size: 0.96rem;
            font-weight: 500;
            color: #fff;
        }
        .vault-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .vault-play-btn {
            background: rgba(212, 175, 55, 0.12);
            color: var(--gold-light);
            border: 1px solid rgba(212, 175, 55, 0.25);
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .vault-play-btn:hover {
            background: var(--gold-primary);
            color: #0b0f16;
        }

        /* FULLSCREEN ZEN MODE OVERLAY (WORKS ON ALL MOBILES & DESKTOPS) */
        body.zen-mode {
            padding: 16px 12px !important;
            justify-content: center !important;
            align-items: center !important;
            overflow: hidden !important;
            background: #06090f !important;
        }
        body.zen-mode .lang-switch-container,
        body.zen-mode header,
        body.zen-mode .preset-section,
        body.zen-mode .settings-card,
        body.zen-mode .sound-vault-toggle,
        body.zen-mode .vault-container,
        body.zen-mode footer {
            display: none !important;
        }
        body.zen-mode .app-container {
            height: 100vh;
            max-height: 100%;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }
        body.zen-mode .timer-display-card {
            border: none !important;
            box-shadow: none !important;
            background: transparent !important;
            padding: 0 !important;
            width: 100%;
        }
        body.zen-mode .dial-wrapper {
            width: min(82vw, 360px);
            height: min(82vw, 360px);
        }
        body.zen-mode .time-text {
            font-size: clamp(3.2rem, 12vw, 5rem);
        }
        body.zen-mode .controls-row {
            margin-top: 18px;
            width: 100%;
            max-width: 360px;
        }
        body.zen-mode #fullscreenBtn {
            background: rgba(212, 175, 55, 0.18);
            border-color: var(--gold-primary);
            color: var(--gold-light);
        }

        footer {
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-align: center;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="lang-switch-container">
        <button class="lang-switch-btn" id="langSwitchBtn" onclick="toggleLanguage()">
            <span>🌐</span> <span id="langSwitchText">中文</span>
        </button>
    </div>

    <header>
        <h1 id="headerTitle">Meditation Timer</h1>
        <p class="sub-title" id="headerSubtitle">MINDFULNESS & INNER PEACE · ALL IS SILENT</p>
    </header>

    <main class="app-container">

        <!-- 1. TIMER DIAL & DISPLAY -->
        <div class="timer-display-card" id="timerCard">
            <div class="dial-wrapper">
                <div class="breathing-halo"></div>
                <svg class="dial-svg" viewBox="0 0 300 300">
                    <defs>
                        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f5df8b" />
                            <stop offset="50%" stop-color="#d4af37" />
                            <stop offset="100%" stop-color="#9a7b1c" />
                        </linearGradient>
                    </defs>
                    <circle class="dial-bg" cx="150" cy="150" r="135" />
                    <circle class="dial-progress" id="progressCircle" cx="150" cy="150" r="135" />
                </svg>

                <div class="dial-center-content">
                    <div class="time-text" id="timeDisplay">15:00</div>
                    <div class="status-badge" id="statusBadge">
                        <span class="status-dot"></span>
                        <span id="statusText">Ready to Begin</span>
                    </div>
                </div>
            </div>

            <!-- CONTROLS: START / PAUSE / RESET -->
            <div class="controls-row">
                <button class="btn-secondary" id="resetBtn" title="Reset Timer">Reset</button>
                <button class="btn-primary" id="startBtn">
                    <span id="startBtnIcon">▶</span>
                    <span id="startBtnText">Start</span>
                </button>
                <button class="btn-secondary" id="fullscreenBtn" title="Zen Fullscreen Mode">Fullscreen</button>
            </div>
        </div>

        <!-- 2. PRESET TIMER BUTTONS -->
        <div class="preset-section">
            <div class="section-label">
                <span id="presetLabel">Meditation Duration (Presets)</span>
                <span id="currentPresetTip">Current: 15 min</span>
            </div>
            <div class="preset-grid">
                <button class="preset-btn active" data-minutes="15">
                    15
                    <span class="unit">min</span>
                </button>
                <button class="preset-btn" data-minutes="30">
                    30
                    <span class="unit">min</span>
                </button>
                <button class="preset-btn" data-minutes="45">
                    45
                    <span class="unit">min</span>
                </button>
                <button class="preset-btn" data-minutes="60">
                    60
                    <span class="unit">min</span>
                </button>
                <button class="preset-btn" data-minutes="90">
                    90
                    <span class="unit">min</span>
                </button>
                <button class="preset-btn" data-minutes="120">
                    120
                    <span class="unit">min</span>
                </button>
            </div>

            <!-- Custom adjustments & Quick test -->
            <div class="custom-time-row">
                <button class="custom-time-btn" id="adjMinus5" onclick="adjustTime(-300)">- 5 min</button>
                <button class="custom-time-btn" id="adjMinus1" onclick="adjustTime(-60)">- 1 min</button>
                <button class="custom-time-btn" id="adjPlus1" onclick="adjustTime(60)">+ 1 min</button>
                <button class="custom-time-btn" id="adjPlus5" onclick="adjustTime(300)">+ 5 min</button>
                <button class="custom-time-btn quick-test-badge" id="test10s" onclick="setExactSeconds(10)" title="Test Ending Bell">⚡ Test 10s</button>
                <button class="custom-time-btn quick-test-badge" id="test1m" onclick="setExactSeconds(60)" title="Test 1 Minute">⚡ 1 min</button>
            </div>
        </div>

        <!-- 3. SOUND SETTINGS -->
        <div class="settings-card">
            <div class="setting-row">
                <div class="setting-label">
                    <span id="endSoundLabel">🔔 Ending Bell (Conclusion)</span>
                </div>
                <div class="setting-controls">
                    <select class="sound-select" id="endSoundSelect">
                    </select>
                    <button class="icon-btn" id="previewSoundBtn" title="Preview Sound">
                        <span>▶</span> <span class="preview-text">Preview</span>
                    </button>
                </div>
            </div>

            <div class="setting-row">
                <div class="setting-label">
                    <span id="startSoundLabel">🥢 Starting Chime (Beginning)</span>
                </div>
                <div class="setting-controls">
                    <select class="sound-select" id="startSoundSelect">
                    </select>
                    <button class="icon-btn" id="previewStartSoundBtn" title="Preview Sound">
                        <span>▶</span> <span class="preview-text">Preview</span>
                    </button>
                </div>
            </div>

            <div class="setting-row">
                <div class="setting-label">
                    <span id="intervalSoundLabel">⏱️ Interval Chime (>15 min)</span>
                </div>
                <div class="setting-controls">
                    <select class="sound-select" id="intervalSoundSelect">
                    </select>
                    <button class="icon-btn" id="previewIntervalSoundBtn" title="Preview Sound">
                        <span>▶</span> <span class="preview-text">Preview</span>
                    </button>
                </div>
            </div>

            <div class="toggles-row">
                <label class="toggle-item">
                    <input type="checkbox" id="keepScreenOn" checked>
                    <span id="keepScreenLabel">Keep Screen Awake</span>
                </label>
                <label class="toggle-item">
                    <input type="checkbox" id="autoLoopSound">

        // --- I18N RENDER ENGINE ---
        function applyLanguage(lang) {
            currentLang = lang;

        function populateSoundSelects(lang) {
            const t = I18N[lang];

            // 1. Ending Sound Select
            const currentEndVal = endSoundSelect.value || "sounds/daqing_3strikes_01_ancient_bronze.mp3";

        function renderSoundVault(lang) {

                    textWrap.appendChild(desc);

                    card.appendChild(btn);
                    grid.appendChild(card);

                section.appendChild(grid);
                vaultContainer.appendChild(section);

        // --- MOBILE AUDIO UNLOCK & KEEP-ALIVE ---
        function unlockMobileAudio() {
            // 1. Unlock Web Audio API context for iOS Safari
            try {
                const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                if (AudioCtxClass) {
                    if (!window.meditationAudioCtx) {
                        window.meditationAudioCtx = new AudioCtxClass();
                    }
                    if (window.meditationAudioCtx.state === 'suspended') {
                        window.meditationAudioCtx.resume();
                    }
                    // Play a 1-sample silent buffer to unlock hardware pipeline
                    const buffer = window.meditationAudioCtx.createBuffer(1, 1, 22050);
                    const source = window.meditationAudioCtx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(window.meditationAudioCtx.destination);
                    source.start(0);
                }
            } catch (e) {
                console.log('WebAudio unlock info:', e);
            }

            // 2. Pre-assign and load all HTML5 Audio elements during touch gesture
            try {
                globalAudioPlayer.src = endSoundSelect.value;
                globalAudioPlayer.load();

                if (intervalSoundSelect.value !== 'none') {
                    intervalAudioPlayer.src = intervalSoundSelect.value;
                    intervalAudioPlayer.load();
                }

                if (startSoundSelect.value !== 'none') {
                    startAudioPlayer.src = startSoundSelect.value;
                    startAudioPlayer.load();
                }
            } catch (e) {
                console.log('HTML5 Audio preload info:', e);
            }

            // 3. Play silent audio loop (prevents iOS / Android from suspending the tab in background)
            try {
                silentAudioPlayer.volume = 0.01;
                const p = silentAudioPlayer.play();
                if (p && p.catch) p.catch(e => console.log('Silent audio keep-alive blocked:', e));
            } catch (e) {}

            // 4. Register MediaSession metadata (supports lock-screen display & controls on iOS/Android)
            if ('mediaSession' in navigator) {
                try {
                    const t = I18N[currentLang];
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: t.mediaTitle,
                        artist: t.mediaArtist,
                        album: t.mediaAlbum
                    });
                    navigator.mediaSession.playbackState = 'playing';
                    navigator.mediaSession.setActionHandler('play', () => { if (isPaused) startTimer(); });
                    navigator.mediaSession.setActionHandler('pause', () => { if (isRunning) pauseTimer(); });
                } catch (e) {}
            }
        }

        // --- FORMAT TIME UTILS ---
        function formatTime(sec) {
            sec = Math.max(0, Math.floor(sec));
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;

            if (h > 0) {
                return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            } else {
                return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            }
        }

        function updateDisplay(instant = false) {
            timeDisplay.textContent = formatTime(remainingSeconds);
            const fraction = totalSeconds > 0 ? (remainingSeconds / totalSeconds) : 0;
            const offset = CIRCUMFERENCE * (1 - fraction);

            if (instant) {
                progressCircle.style.transition = 'none';
                progressCircle.style.strokeDashoffset = offset;
                void progressCircle.offsetWidth; // force reflow
                progressCircle.style.transition = 'stroke-dashoffset 0.85s linear';
            } else {
                progressCircle.style.strokeDashoffset = offset;
            }

            const t = I18N[currentLang];
            document.title = isRunning ? t.runningTitle(formatTime(remainingSeconds)) : t.pageTitle;
        }

        // --- PRESET SELECTION ---
        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const minutes = parseInt(btn.getAttribute('data-minutes'), 10);
                selectedPresetMinutes = minutes;
                presetBtns.forEach(b => b.classList.toggle('active', b === btn));
                totalSeconds = minutes * 60;
                const t = I18N[currentLang];
                currentPresetTip.textContent = t.presetCurrent(minutes);
                resetTimer(false);
            });
        });

        function adjustTime(deltaSeconds) {
            totalSeconds = Math.max(10, (isRunning ? remainingSeconds : totalSeconds) + deltaSeconds);
            presetBtns.forEach(b => b.classList.remove('active'));
            const t = I18N[currentLang];
            currentPresetTip.textContent = totalSeconds < 60 ? t.customCurrentSec(totalSeconds) : t.customCurrentMin(Math.round(totalSeconds / 60));
            resetTimer(false);
        }

        function setExactSeconds(sec) {
            totalSeconds = sec;
            presetBtns.forEach(b => b.classList.remove('active'));
            const t = I18N[currentLang];
            currentPresetTip.textContent = sec < 60 ? t.testCurrentSec(sec) : t.testCurrentMin(Math.round(sec / 60));
            resetTimer(false);
        }

        // --- TIMER TICK ENGINE (WALL-CLOCK ACCURATE) ---
        function timerTick() {
            if (!isRunning || isPaused || targetEndTime <= 0) return;

            const now = Date.now();
            const diffMs = targetEndTime - now;

            if (diffMs > 0) {
                const newRemaining = Math.ceil(diffMs / 1000);
                if (newRemaining !== remainingSeconds) {
                    remainingSeconds = newRemaining;
                    updateDisplay(false);

                    // Interval reminder: If total > 15m (900s), chime every 15m elapsed, ending sound on finish
                    const elapsedSeconds = totalSeconds - remainingSeconds;
                    const milestone = Math.floor(elapsedSeconds / (15 * 60));
                    if (totalSeconds > 15 * 60 && remainingSeconds > 0 && milestone > 0 && milestone !== lastIntervalMilestone && (elapsedSeconds % (15 * 60) === 0)) {
                        lastIntervalMilestone = milestone;
                        triggerIntervalChime(elapsedSeconds);
                    }
                }
            } else {
                remainingSeconds = 0;
                updateDisplay(false);
                onTimerFinished();
            }
        }

        // --- TIMER CONTROL ENGINE ---
        function startTimer() {
            // If timer was at 00:00, reset before starting
            if (remainingSeconds <= 0) {
                resetTimer(false);
            }

            if (isRunning && !isPaused) return;

            const t = I18N[currentLang];

            // 1. Critical for Mobile: Unlock audio inside touch handler
            unlockMobileAudio();

            // 2. Play start chime if fresh start
            if (!isPaused && remainingSeconds === totalSeconds) {
                playStartBell();
            }

            isRunning = true;
            isPaused = false;

            // 3. Absolute wall-clock timestamp (prevents mobile background timer freeze)
            targetEndTime = Date.now() + remainingSeconds * 1000;

            timerCard.classList.add('running');
            timerCard.classList.remove('paused');
            statusText.textContent = t.statusRunning;
            startBtnText.textContent = t.pauseBtn;
            startBtnIcon.textContent = "⏸";

            acquireWakeLock();

            clearInterval(timerInterval);
            timerInterval = setInterval(timerTick, 500); // 500ms check for instant responsiveness
        }

        function triggerIntervalChime(elapsedSeconds) {
            playIntervalChime();
            const t = I18N[currentLang];
            const elapsedMinutes = Math.floor(elapsedSeconds / 60);
            statusText.textContent = t.statusInterval(elapsedMinutes);
            clearTimeout(intervalStatusTimeout);
            intervalStatusTimeout = setTimeout(() => {
                if (isRunning && !isPaused) {
                    statusText.textContent = t.statusRunning;
                }
            }, 6000);
        }

        function pauseTimer() {
            if (!isRunning || isPaused) return;
            clearInterval(timerInterval);
            timerInterval = null;
            isPaused = true;
            targetEndTime = 0;

            if (silentAudioPlayer) {
                silentAudioPlayer.pause();
            }
            if ('mediaSession' in navigator) {
                try { navigator.mediaSession.playbackState = 'paused'; } catch(e){}
            }

            const t = I18N[currentLang];
            timerCard.classList.add('paused');
            statusText.textContent = t.statusPaused;
            startBtnText.textContent = t.resumeBtn;
            startBtnIcon.textContent = "▶";
            releaseWakeLock();
        }

        /**
         * Reset Timer
         * @param {boolean} restorePreset - If true, reverts custom/test times back to the baseline preset
         */
        function resetTimer(restorePreset = false) {
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
            isPaused = false;
            targetEndTime = 0;
            lastIntervalMilestone = 0;
            clearTimeout(intervalStatusTimeout);

            if (silentAudioPlayer) {
                silentAudioPlayer.pause();
                silentAudioPlayer.currentTime = 0;
            }
            if ('mediaSession' in navigator) {
                try { navigator.mediaSession.playbackState = 'none'; } catch(e){}
            }

            const t = I18N[currentLang];
            if (restorePreset) {
                totalSeconds = selectedPresetMinutes * 60;
                presetBtns.forEach(b => {
                    b.classList.toggle('active', parseInt(b.getAttribute('data-minutes'), 10) === selectedPresetMinutes);
                });
                currentPresetTip.textContent = t.presetCurrent(selectedPresetMinutes);
            }

            remainingSeconds = totalSeconds;

            timerCard.classList.remove('running', 'paused');
            statusText.textContent = t.statusReady;
            startBtnText.textContent = t.startBtn;
            startBtnIcon.textContent = "▶";

            stopAudio();
            updateDisplay(true);
            releaseWakeLock();
        }

        function onTimerFinished() {
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
            isPaused = false;
            targetEndTime = 0;
            lastIntervalMilestone = 0;
            clearTimeout(intervalStatusTimeout);
            remainingSeconds = 0;
            updateDisplay(false);

            if (silentAudioPlayer) {
                silentAudioPlayer.pause();
                silentAudioPlayer.currentTime = 0;
            }

            const t = I18N[currentLang];
            timerCard.classList.remove('running', 'paused');
            statusText.textContent = t.statusFinished;
            startBtnText.textContent = t.startBtn;
            startBtnIcon.textContent = "▶";

            playEndingBell();
            releaseWakeLock();

            if ("vibrate" in navigator) {
                navigator.vibrate([400, 200, 400, 200, 600]);
            }
        }

        // --- AUDIO PLAYBACK ---
        function playStartBell() {
            const soundSrc = startSoundSelect.value;
            if (soundSrc && soundSrc !== 'none') {
                startAudioPlayer.src = soundSrc;
                startAudioPlayer.volume = 0.9;
                startAudioPlayer.currentTime = 0;
                startAudioPlayer.play().catch(e => console.log('Start bell error:', e));
            }
        }

        function playIntervalChime() {
            const soundSrc = intervalSoundSelect.value;
            if (soundSrc && soundSrc !== 'none') {
                intervalAudioPlayer.src = soundSrc;
                intervalAudioPlayer.volume = 0.85;
                intervalAudioPlayer.currentTime = 0;
                intervalAudioPlayer.play().catch(e => console.log('Interval chime error:', e));
            }
        }

        function playEndingBell() {
            const soundSrc = endSoundSelect.value;
            if (soundSrc) {
                globalAudioPlayer.src = soundSrc;
                globalAudioPlayer.loop = autoLoopSoundCheckbox.checked;
                globalAudioPlayer.volume = 1.0;
                globalAudioPlayer.currentTime = 0;
                globalAudioPlayer.play().catch(e => console.log('Ending bell error:', e));
            }
        }

        function playSpecificSound(src) {
            stopAudio();
            globalAudioPlayer.src = src;
            globalAudioPlayer.loop = false;
            globalAudioPlayer.volume = 1.0;
            globalAudioPlayer.currentTime = 0;
            globalAudioPlayer.play().catch(e => console.log('Audio play error:', e));
        }

        function stopAudio() {
            if (globalAudioPlayer) {
                globalAudioPlayer.pause();
                globalAudioPlayer.currentTime = 0;
            }
            if (startAudioPlayer) {
                startAudioPlayer.pause();
                startAudioPlayer.currentTime = 0;
            }
            if (intervalAudioPlayer) {
                intervalAudioPlayer.pause();
                intervalAudioPlayer.currentTime = 0;
            }
            if (silentAudioPlayer) {
                silentAudioPlayer.pause();
                silentAudioPlayer.currentTime = 0;
            }
            const t = I18N[currentLang];
            if (previewSoundBtn) {
                previewSoundBtn.innerHTML = `<span>▶</span> <span class="preview-text">${t.previewBtn}</span>`;
            }
            if (previewStartSoundBtn) {
                previewStartSoundBtn.innerHTML = `<span>▶</span> <span class="preview-text">${t.previewBtn}</span>`;
            }
            if (previewIntervalSoundBtn) {
                previewIntervalSoundBtn.innerHTML = `<span>▶</span> <span class="preview-text">${t.previewBtn}</span>`;
            }
            isPreviewing = false;
        }

        // Preview End Bell button
        previewSoundBtn.addEventListener('click', () => {
            const t = I18N[currentLang];
            if (isPreviewing) {
                stopAudio();
            } else {
                playSpecificSound(endSoundSelect.value);
                previewSoundBtn.innerHTML = `<span>⏹</span> <span class="preview-text">${t.stopBtn}</span>`;
                isPreviewing = true;
                globalAudioPlayer.onended = () => {
                    previewSoundBtn.innerHTML = `<span>▶</span> <span class="preview-text">${t.previewBtn}</span>`;
                    isPreviewing = false;
                };
            }
        });

        // Preview Start Bell button
        if (previewStartSoundBtn) {
            previewStartSoundBtn.addEventListener('click', () => {
                const t = I18N[currentLang];
                if (startSoundSelect.value === 'none') {
                    alert(t.alertSilentStart);
                    return;
                }
                if (isPreviewing) {
                    stopAudio();
                } else {
                    playSpecificSound(startSoundSelect.value);
                    previewStartSoundBtn.innerHTML = `<span>⏹</span> <span class="preview-text">${t.stopBtn}</span>`;
                    isPreviewing = true;
                    globalAudioPlayer.onended = () => {
                        previewStartSoundBtn.innerHTML = `<span>▶</span> <span class="preview-text">${t.previewBtn}</span>`;
                        isPreviewing = false;
                    };
                }
            });
        }

        // Preview Interval Bell button
        if (previewIntervalSoundBtn) {
            previewIntervalSoundBtn.addEventListener('click', () => {
                const t = I18N[currentLang];
                if (intervalSoundSelect.value === 'none') {
                    alert(t.alertNoInterval);
                    return;
                }
                if (isPreviewing) {
                    stopAudio();
                } else {
                    playSpecificSound(intervalSoundSelect.value);
                    previewIntervalSoundBtn.innerHTML = `<span>⏹</span> <span class="preview-text">${t.stopBtn}</span>`;
                    isPreviewing = true;
                    globalAudioPlayer.onended = () => {
                        previewIntervalSoundBtn.innerHTML = `<span>▶</span> <span class="preview-text">${t.previewBtn}</span>`;
                        isPreviewing = false;
                    };
                }
            });
        }

        // Toggle Sound Vault
        toggleVaultBtn.addEventListener('click', () => {
            vaultContainer.classList.toggle('show');
            const t = I18N[currentLang];
            toggleVaultText.textContent = vaultContainer.classList.contains('show') ? t.toggleVaultCollapse : t.toggleVaultExpand;
            if (vaultContainer.classList.contains('show')) {
                toggleVaultBtn.scrollIntoView({ behavior: 'smooth' });
            }
        });

        // --- BUTTON EVENTS ---
        startBtn.addEventListener('click', () => {
            if (remainingSeconds <= 0) {
                resetTimer(false);
                startTimer();
            } else if (!isRunning || isPaused) {
                startTimer();
            } else {
                pauseTimer();
            }
        });

        // Reset button restores to the selected preset cleanly
        resetBtn.addEventListener('click', () => {
            resetTimer(true);
        });

        // --- ROBUST FULLSCREEN / ZEN MODE ENGINE (MOBILE & DESKTOP COMPATIBLE) ---
        function isFullscreenActive() {
            const doc = document;
            const hasNativeFs = !!(doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement);
            return hasNativeFs || document.body.classList.contains('zen-mode');
        }

        function updateFullscreenBtnUI(active) {
            const t = I18N[currentLang];
            fullscreenBtn.textContent = active ? t.exitFullscreenBtn : t.fullscreenBtn;
            fullscreenBtn.title = active ? t.exitFullscreenBtn : t.fullscreenBtn;
        }

        function enterZenFullscreen() {
            document.body.classList.add('zen-mode');
            updateFullscreenBtnUI(true);

            // Try native HTML5 Fullscreen API with vendor prefixes
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.webkitRequestFullScreen) {
                elem.webkitRequestFullScreen();
            } else if (elem.mozRequestFullScreen) {
                elem.mozRequestFullScreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }

        function exitZenFullscreen() {
            document.body.classList.remove('zen-mode');
            updateFullscreenBtnUI(false);

            const doc = document;
            if (doc.exitFullscreen && doc.fullscreenElement) {
                doc.exitFullscreen().catch(() => {});
            } else if (doc.webkitExitFullscreen && doc.webkitFullscreenElement) {
                doc.webkitExitFullscreen();
            } else if (doc.mozCancelFullScreen && doc.mozFullScreenElement) {
                doc.mozCancelFullScreen();
            } else if (doc.msExitFullscreen && doc.msFullscreenElement) {
                doc.msExitFullscreen();
            }
        }

        fullscreenBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isFullscreenActive()) {
                exitZenFullscreen();
            } else {
                enterZenFullscreen();
            }
        });

        // Listen to native fullscreen changes across browsers
        ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
            document.addEventListener(evt, () => {
                const doc = document;
                const isNativeFs = !!(doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement);
                if (!isNativeFs && document.body.classList.contains('zen-mode')) {
                    // Only exit zen-mode if exited natively
                    document.body.classList.remove('zen-mode');
                    updateFullscreenBtnUI(false);
                }
            });
        });

        // --- WAKE LOCK API (KEEP SCREEN AWAKE) ---
        async function acquireWakeLock() {
            if (!keepScreenOnCheckbox.checked) return;
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.log('WakeLock not acquired:', err);
                }
            }
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        // --- RESUME & RECALIBRATE ON MOBILE TAB WAKEUP ---
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                if (isRunning && !isPaused) {
                    acquireWakeLock();
                    timerTick(); // Immediate recalibration
                }
            }
        });

        window.addEventListener('pageshow', () => {
            if (isRunning && !isPaused) {
                timerTick();
            }
        });

        // Initial setup with English default
        applyLanguage(currentLang);
        updateDisplay();
    </script>
</body>
</html>
